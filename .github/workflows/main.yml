name: Gerar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias do app
        run: npm install --legacy-peer-deps

      - name: Instalar Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: Gerar o site
        run: npm run build

      - name: Criar projeto Android se nao existir
        run: |
          if [ ! -d android ]; then
            rm -f capacitor.config.ts
            echo '{"appId":"com.wiliana.app","appName":"app","webDir":"dist"}' > capacitor.config.json
            npx cap add android
          fi

      - name: Copiar o site para o Android
        run: npx cap sync android

      - name: Compilar o APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar na Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Versao ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
